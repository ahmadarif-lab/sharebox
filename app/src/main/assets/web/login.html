<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B6BFF">
<link rel="icon" type="image/webp" href="/icon.webp">
<title>ShareBox</title>
<link rel="stylesheet" href="/style.css">
<script>
  try { if (localStorage.getItem('sb.theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
</script>
<style>
  .login-wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
  .login { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px 24px; width: min(380px, 100%); }
  .login .logo { display: block; width: 52px; height: 52px; margin-bottom: 16px; }
  .login .logo img { width: 100%; height: 100%; border-radius: 14px; }
  .login h1 { margin: 0 0 4px; font-size: 20px; }
  .login p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .login input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel-2); color: var(--fg); font: inherit; font-size: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; outline: none;
  }
  .login input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .login .err { min-height: 20px; margin: 8px 0 6px; color: var(--danger); font-size: 13px; }
  .login .btn { width: 100%; justify-content: center; padding: 11px 14px; }
</style>
</head>
<body>
<main class="login-wrap">
  <form class="login" id="form" autocomplete="off">
    <span class="logo"><img src="/icon.webp" alt=""></span>
    <h1>ShareBox</h1>
    <p>Enter the password shown in the ShareBox app on the phone.</p>
    <input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-label="Password" placeholder="Password" required autofocus>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary" id="go" type="submit">Open</button>
  </form>
</main>
<script>
(() => {
  'use strict';
  const form = document.getElementById('form');
  const pw = document.getElementById('pw');
  const err = document.getElementById('err');
  const go = document.getElementById('go');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      if (r.ok) { location.replace('/'); return; }
      let msg = 'HTTP ' + r.status;
      try { msg = (await r.json()).error || msg; } catch (x) { /* not json */ }
      err.textContent = msg;
      pw.select();
    } catch (x) {
      err.textContent = 'Cannot reach the phone. Is the web server still on?';
    } finally {
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
